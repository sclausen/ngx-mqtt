name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@^11.16.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm stage publish --provenance --access public
        working-directory: dist/ngx-mqtt
      - run: |
          {
            echo "## ngx-mqtt staged on npm"
            echo
            echo "The release is staged and not public yet. Approve it with 2FA:"
            echo
            echo '```'
            echo 'npm stage list ngx-mqtt'
            echo 'npm stage approve <stage-id>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
